# The servers under measurement.
#
# Every server below is pinned to an exact version and every field under it that describes the
# server -- tool_count, protocol answered, whether it started with nothing -- was MEASURED by
# harness/probe.py, not asserted. The evidence is the probe file named in probe_ref, which is
# committed, and tests/test_corpus_matches_probes.py fails if any corpus argument stops
# validating against the schema in it. That test is what keeps this file from drifting back into
# plausible guesses, which is what it held before: of the four tool names guessed for
# `everything`, three did not exist.
#
# Pinning style, and its limit. Versions are exact (npm `@x.y.z`, PyPI `@x.y.z`), which makes a
# run reproducible and stops a later malicious release from silently changing a number. It is
# NOT a digest pin: npm and PyPI immutability means a given version string cannot be
# republished with different content, but it also does not prove the bytes we got are the bytes
# someone else gets through a different registry mirror. Pinning by digest (npm integrity, or a
# pinned image) is the stronger form and is still open. Stated rather than implied.
#
# A server that needs credentials is launched WITHOUT them on purpose (gate rule 5: no real
# credentials). The measurement is of egress behavior, not of a successful API call: a call that
# fails auth still reveals the destination host and whether our arguments were forwarded, which
# is what numbers 1, 2 and 5 measure.
#
# That reasoning has one measured exception and the probe found it. brave-search does not fail
# auth -- it never opens a connection at all, exiting before the JSON-RPC handshake with
# "BRAVE_API_KEY environment variable is required". For that server the sentence above is simply
# false, and "run it without credentials and watch the attempt" yields no attempt to watch. See
# docs/THREATS.md, threat 8.
#
# TWO PASSES, TWO CORPORA. Phase B is driven twice and the two results are published separately
# (docs/PROTOCOL.md, phase B). `corpus_ref` is the SEQUENTIAL corpus: one call at a time, which is
# what numbers 1, 2, 3 and 4 are read from. `concurrent_corpus_ref` is the CONCURRENT corpus,
# driven as waves of N calls in flight at once, which is the only condition in which the
# attribution grades of number 5 can be anything but CONTENT_MATCH_UNCONTESTED.
#
# `env` is per-server launch configuration, and it may hold NOTHING SECRET. Gate rule 5 keeps
# tokens outside the repository and outside the image, so this field is for declarations about the
# environment, not for credentials. Its one current use is the measured one: puppeteer's server
# reads DOCKER_CONTAINER and, when it is set, launches Chrome with the flags a container needs.
# Without it Chrome refuses to run as root and every call to that server errors, which records zero
# egress for one of the three egress-capable servers for a reason that is ours and not the
# server's. Setting it in the registry rather than in the corpus is deliberate: it is harness
# configuration, so it must not appear in the ARGUMENTS the concurrent pass measures overlap on.
#
# `max_concurrency` caps N per server and `max_concurrency_why` says why that cap and not another,
# in the server's own terms: a cap chosen without a reason is a knob someone turns later to get a
# nicer number. The ladder driven is 2, 5 and 10, the same levels as the phase A bench, limited by
# this cap and by the length of the concurrent corpus.

# k is the matcher's k-gram length and it is NOT a preference: it was chosen by the sweep in
# docs/CALIBRATION.md (F1.2) and must equal src/mcpfanout/shingle.DEFAULT_K, which a test enforces.
# Changing it here alone would give a capture a different matcher from the one the calibration
# figures describe.
k: 22
w: 8

servers:
  # --- Local by design: controls. Expected fan-out ~0. If they egress, that is the finding. ---
  - id: everything
    launch: ["npx", "-y", "@modelcontextprotocol/server-everything@2026.8.31"]
    corpus_ref: corpus/calls/everything.json
    concurrent_corpus_ref: corpus/concurrent/everything.json
    max_concurrency: 10
    max_concurrency_why: >-
      Ten: the corpus has ten calls, it is a local control, and every call is cheap, so the full
      ladder 2/5/10 costs nothing.
    probe_ref: registry/probes/everything.json
    expects_egress: false
    needs_credentials: false
    tool_count: 13
    started_without_credentials: true
    protocol_version_answered: "2025-11-25"

  - id: filesystem
    launch: ["npx", "-y", "@modelcontextprotocol/server-filesystem@2026.8.31", "/app/corpus"]
    corpus_ref: corpus/calls/filesystem.json
    concurrent_corpus_ref: corpus/concurrent/filesystem.json
    max_concurrency: 10
    max_concurrency_why: >-
      Ten: local reads of a read-only mount, cheap enough for the full ladder.
    probe_ref: registry/probes/filesystem.json
    expects_egress: false
    needs_credentials: false
    tool_count: 14
    started_without_credentials: true
    protocol_version_answered: "2025-11-25"

  - id: memory
    launch: ["npx", "-y", "@modelcontextprotocol/server-memory@2026.8.31"]
    corpus_ref: corpus/calls/memory.json
    concurrent_corpus_ref: corpus/concurrent/memory.json
    max_concurrency: 10
    max_concurrency_why: >-
      Ten: the knowledge graph is a local JSON file, so concurrency costs nothing. Its writes are
      ours and stay in the container.
    probe_ref: registry/probes/memory.json
    expects_egress: false
    needs_credentials: false
    tool_count: 9
    started_without_credentials: true
    protocol_version_answered: "2025-11-25"

  - id: sequential-thinking
    launch: ["npx", "-y", "@modelcontextprotocol/server-sequential-thinking@2026.8.31"]
    corpus_ref: corpus/calls/sequential-thinking.json
    concurrent_corpus_ref: corpus/concurrent/sequential-thinking.json
    max_concurrency: 5
    max_concurrency_why: >-
      Five: the corpus is one reasoning chain of five steps, and inventing five more thoughts to
      reach N=10 would be padding, not realism. Ladder stops at 5.
    probe_ref: registry/probes/sequential-thinking.json
    expects_egress: false
    needs_credentials: false
    tool_count: 1
    started_without_credentials: true
    protocol_version_answered: "2025-11-25"

  - id: git
    launch: ["uvx", "mcp-server-git@2026.8.18"]
    corpus_ref: corpus/calls/git.json
    concurrent_corpus_ref: corpus/concurrent/git.json
    max_concurrency: 10
    max_concurrency_why: >-
      Ten: read-only git commands on a small repository inside the image.
    probe_ref: registry/probes/git.json
    expects_egress: false
    needs_credentials: false
    tool_count: 12
    started_without_credentials: true
    protocol_version_answered: "2025-11-25"

  - id: time
    launch: ["uvx", "mcp-server-time@2026.8.18"]
    corpus_ref: corpus/calls/time.json
    concurrent_corpus_ref: corpus/concurrent/time.json
    max_concurrency: 10
    max_concurrency_why: >-
      Ten: pure computation, no egress expected at all.
    probe_ref: registry/probes/time.json
    expects_egress: false
    needs_credentials: false
    tool_count: 2
    started_without_credentials: true
    protocol_version_answered: "2025-11-25"

  # --- Egress by design: the interesting ones. These reach a third party. ---
  - id: fetch
    launch: ["uvx", "mcp-server-fetch@2026.8.18"]
    corpus_ref: corpus/calls/fetch.json
    concurrent_corpus_ref: corpus/concurrent/fetch.json
    max_concurrency: 10
    max_concurrency_why: >-
      Ten: one request per call to a reserved example domain, and the interesting server for this
      pass, so it gets the full ladder.
    probe_ref: registry/probes/fetch.json
    expects_egress: true
    needs_credentials: false
    tool_count: 1
    started_without_credentials: true
    protocol_version_answered: "2025-11-25"

  - id: brave-search
    launch: ["npx", "-y", "@modelcontextprotocol/server-brave-search@0.6.2"]
    corpus_ref: corpus/calls/brave-search.json
    concurrent_corpus_ref: corpus/concurrent/brave-search.json
    max_concurrency: 3
    max_concurrency_why: >-
      Three, and academic: this server exits before the handshake without BRAVE_API_KEY, so with no
      lab key the concurrent pass drives nothing here. The cap matches the corpus rather than
      pretending to a ladder.
    # The probe that yielded these schemas ran with BRAVE_API_KEY set to the literal string
    # "placeholder-not-a-real-key", because the server exits before the handshake without it.
    # A placeholder is not a credential and the probe calls no tool, so nothing egressed.
    # brave-search.without-credentials.json is the unaided attempt, kept so that "we have its
    # schemas" cannot be mistaken for "it starts on its own".
    probe_ref: registry/probes/brave-search.json
    expects_egress: true
    needs_credentials: true
    tool_count: 2
    started_without_credentials: false     # measured: exits on missing BRAVE_API_KEY, no connection attempt
    protocol_version_answered: "2024-11-05"
    deprecated_upstream: "2024-12-04"      # last npm release; marked deprecated on the registry

  - id: github
    launch: ["npx", "-y", "@modelcontextprotocol/server-github@2025.4.8"]
    corpus_ref: corpus/calls/github.json
    concurrent_corpus_ref: corpus/concurrent/github.json
    max_concurrency: 10
    max_concurrency_why: >-
      Ten: read-only API calls. Unauthenticated search is rate limited to about ten requests a
      minute, so a wave of ten is expected to produce 403s partway through. Recorded as data: a
      rejected request still egressed, and the destination and the forwarded argument are what
      numbers 1, 2 and 5 measure.
    probe_ref: registry/probes/github.json
    expects_egress: true
    # Measured correction: needs_credentials is about the API, not the launch. This server starts
    # with no GITHUB_TOKEN whatsoever and lists all 26 tools; the token is only needed for a call
    # to succeed. The distinction matters because "could not be probed" and "could not
    # authenticate" bias the numbers differently.
    needs_credentials: true
    tool_count: 26
    started_without_credentials: true
    # Declared by NAME only; the value is read from the environment and lives outside this
    # repository (gate rule 5). Every call in both corpora is a read of public data, so the token
    # this names is minted with zero scopes: see docs/PREREG-F2.md section 14 for the exact scope
    # and docs/LAB-ACCOUNTS.md for why not one permission more.
    secret_env: ["GITHUB_PERSONAL_ACCESS_TOKEN"]
    protocol_version_answered: "2024-11-05"
    deprecated_upstream: "2025-04-08"      # last npm release; superseded by GitHub's own Go server

  - id: puppeteer
    launch: ["npx", "-y", "@modelcontextprotocol/server-puppeteer@2025.5.12"]
    # Read from the package's own source (dist/index.js, 2025.5.12): with DOCKER_CONTAINER set it
    # launches headless with --no-sandbox --single-process --no-zygote. That is the server's own
    # container path, so we take it instead of passing allowDangerous in a tool call: a corpus that
    # sets a flag named "allow dangerous" to measure egress is a corpus doing something else.
    env:
      DOCKER_CONTAINER: "true"
    corpus_ref: corpus/calls/puppeteer.json
    concurrent_corpus_ref: corpus/concurrent/puppeteer.json
    max_concurrency: 2
    max_concurrency_why: >-
      Two, and this one is a judgement call with a residual. The server keeps a single browser page,
      so concurrent navigations are either queued or refused; N=2 answers which, at the cost of one
      extra headless fetch. Higher N would multiply browser cost without asking a new attribution
      question, and what this server does at N=10 stays unmeasured, which is phase C material rather
      than a gap in this pass.
    probe_ref: registry/probes/puppeteer.json
    expects_egress: true
    needs_credentials: false
    tool_count: 7
    started_without_credentials: true
    protocol_version_answered: "2024-11-05"
    deprecated_upstream: "2025-05-12"      # last npm release; removed from the reference server set
