<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 412" width="760" height="412" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Every observability fix lowered the headline figure: 0.89, 0.81, 0.66, against a pre-registered threshold of 0.8">
<style>
  text { fill: #1f2328; }
  text.muted { fill: #57606a; }
  text.value { fill: #d1603d; }
  line.grid { stroke: #d8dee4; }
  line.axis { stroke: #57606a; stroke-opacity: 0.6; }
  line.threshold { stroke: #57606a; }
  @media (prefers-color-scheme: dark) {
    text { fill: #e6edf3; }
    text.muted { fill: #9198a1; }
    line.grid { stroke: #30363d; }
    line.axis { stroke: #9198a1; stroke-opacity: 0.6; }
    line.threshold { stroke: #9198a1; }
  }
</style>
<title>The honesty curve</title>
<desc>Three measurements of one quantity, in the order taken, each after an observability defect in the instrument was fixed. The figure fell every time and ended below the threshold sealed before any measurement existed.</desc>
<g stroke-width="1">
<line class="grid" x1="92" y1="262.0" x2="720" y2="262.0"/>
<line class="grid" x1="92" y1="208.0" x2="720" y2="208.0"/>
<line class="grid" x1="92" y1="154.0" x2="720" y2="154.0"/>
<line class="grid" x1="92" y1="100.0" x2="720" y2="100.0"/>
<line class="grid" x1="92" y1="46.0" x2="720" y2="46.0"/>
</g>
<g font-size="12" text-anchor="end">
<text class="muted" x="80" y="266.0">0.60</text>
<text class="muted" x="80" y="212.0">0.70</text>
<text class="muted" x="80" y="158.0">0.80</text>
<text class="muted" x="80" y="104.0">0.90</text>
<text class="muted" x="80" y="50.0">1.00</text>
</g>
<line class="threshold" x1="92" y1="154.0" x2="720" y2="154.0" stroke-width="1.5" stroke-dasharray="7 5"/>
<text class="muted" x="96" y="145.0" font-size="12" text-anchor="start">pre-registered threshold 0.80</text>
<path d="M168.0,102.9 L406.0,148.9 L644.0,230.7" fill="none" stroke="#d1603d" stroke-width="2.5" stroke-linejoin="round"/>
<circle cx="168.0" cy="102.9" r="6" fill="#d1603d"/>
<text class="value" x="168.0" y="86.9" font-size="16" font-weight="600" text-anchor="middle">0.8947</text>
<text class="muted" x="168.0" y="128.9" font-size="11" text-anchor="middle">17 of 19 flows</text>
<circle cx="406.0" cy="148.9" r="6" fill="#d1603d"/>
<text class="value" x="406.0" y="132.9" font-size="16" font-weight="600" text-anchor="middle">0.8095</text>
<text class="muted" x="406.0" y="174.9" font-size="11" text-anchor="middle">17 of 21 flows</text>
<circle cx="644.0" cy="230.7" r="6" fill="#d1603d"/>
<text class="value" x="644.0" y="214.7" font-size="16" font-weight="600" text-anchor="middle">0.6579</text>
<text class="muted" x="644.0" y="256.7" font-size="11" text-anchor="middle">25 of 38 flows</text>
<line class="axis" x1="92" y1="276.0" x2="720" y2="276.0" stroke-width="1"/>
<line class="axis" x1="168.0" y1="276.0" x2="168.0" y2="282.0" stroke-width="1"/>
<text x="168.0" y="300.0" font-size="12" text-anchor="middle">measurement 1</text>
<text class="muted" x="168.0" y="317.0" font-size="11" text-anchor="middle">first measurement, two blind</text>
<text class="muted" x="168.0" y="331.0" font-size="11" text-anchor="middle">spots still open</text>
<line class="axis" x1="406.0" y1="276.0" x2="406.0" y2="282.0" stroke-width="1"/>
<text x="406.0" y="300.0" font-size="12" text-anchor="middle">measurement 2</text>
<text class="muted" x="406.0" y="317.0" font-size="11" text-anchor="middle">fixed: its own flows</text>
<line class="axis" x1="644.0" y1="276.0" x2="644.0" y2="282.0" stroke-width="1"/>
<text x="644.0" y="300.0" font-size="12" text-anchor="middle">measurement 3</text>
<text class="muted" x="644.0" y="317.0" font-size="11" text-anchor="middle">fixed: Node's global fetch</text>
<text x="92" y="24" font-size="17" font-weight="600">Every repair to the instrument lowered the headline</text>
<text class="muted" x="92" y="382.0" font-size="11">Flows attributable to the tool call that caused them, number 5, measured three times in the order</text>
<text class="muted" x="92" y="396.0" font-size="11">taken. The threshold was sealed before any measurement existed. Regenerate with make</text>
<text class="muted" x="92" y="410.0" font-size="11">honesty-curve.</text>
</svg>
