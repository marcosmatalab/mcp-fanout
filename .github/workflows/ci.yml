# CI runs the measurement CORE only: stdlib-only, no Docker, no network. This is the part that
# must be reproducible and green on every push (gate rule 1). The capture layer is deliberately
# not exercised here; it needs Docker, real servers, and network, none of which belong in CI.
name: ci
on:
  push:
  pull_request:
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (dev extras)
        run: python -m pip install -e ".[dev]"
      - name: Verify core is reproducible and correct
        run: make verify
