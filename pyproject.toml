[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-fanout"
version = "1.0.0rc3"
description = "A reproducible measurement harness for MCP tool-call fan-out and causal-union rate."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Marcos Mata García" }]
keywords = ["mcp", "observability", "provenance", "supply-chain", "measurement"]

# Dependency choices, justified (doctrine: every design decision carries its why).
#
# Runtime core (matching, classification, aggregation) intentionally depends on the
# standard library ONLY. Reason: the core is what CI runs and what `make verify` proves
# reproducible; keeping it dependency-free removes a whole class of "the number changed
# because a transitive dep changed" failures, which is exactly the supply-chain problem
# this project studies. Cost: we reimplement a rolling hash and winnowing (about 120 lines).
# Trade-off accepted: 120 lines we can audit beat a dependency we cannot.
dependencies = []

[project.optional-dependencies]
# Capture layer. Only needed to RUN a live capture, never to compute numbers from records.
# Split out so installing the package without extras stays stdlib-only and CI never pulls
# mitmproxy. It is installed from a release tag of the repository, not from a package index.
capture = [
    "mitmproxy>=11,<13",   # HTTP(S) interception with a local CA. See docs/METHOD.md for why proxy, not eBPF, for the measurement.
    "PyYAML>=6",           # registry/*.yaml parsing only.
]
dev = [
    "pytest>=8",
    "PyYAML>=6",
    # The gates. Declared here rather than left to each machine: a threshold that depends on
    # which version of a linter somebody happens to have is not a gate.
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest-cov>=5",
]

[project.scripts]
mcp-fanout = "mcpfanout.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"


# --- The gates, configured as data so CI and a developer run the same check -------------------

[tool.ruff]
# 100, because that is the width this repository was already written at. Reformatting 7,700 lines
# to 88 would bury every real finding under a diff nobody can review, and the point of turning the
# linter on is the 36 real findings, not the 3,156 line-length ones.
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "SIM", "BLE", "RUF"]

[tool.ruff.lint.per-file-ignores]
# A test that plants a defect sometimes needs the shape of the defect, and a test module's
# imports are its fixtures. Narrow, and by rule rather than by silencing a whole check.
"tests/*" = ["E741"]

[tool.mypy]
files = ["src/mcpfanout"]
python_version = "3.11"
strict = true

[tool.coverage.report]
fail_under = 85
exclude_also = [
    # A branch that only runs when the module is executed as a script is exercised by the
    # Makefile, not by the suite, and a test that imported it would be testing argparse.
    "if __name__ == .__main__.:",
    "raise SystemExit",
]
